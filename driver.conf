# amix-z3660net driver.conf
#
# Consumed by ../amix-kerntools/build-net-kernel.sh (NOT the SCSI build-kernel.sh).
# A STREAMS/DLPI network driver does NOT live in sd.c's scsicard[] table -- it is
# wired directly into master.d/kernel.c's cdevsw[] (d_str -> streamtab) and built
# in its own amiga/driver/<dir>/ subtree, so it uses a different build path.
#
# fields:  net  <dir>  <src>  <streamtab-symbol>  <cdevsw-major>  <iface>  "<description>"
#   <dir>        on-box driver subdir:   /usr/sys/amiga/driver/<dir>/
#   <src>        main source file (all *.c and *.h in src/ are pushed)
#   <streamtab>  the `struct streamtab` symbol placed in cdevsw[major].d_str
#   <major>      cdevsw slot (51; free row, gated at build -- see the note below)
#   <iface>      slink/ifconfig interface name (zen0)
#
# Why 51 (renumbered from 48 on 2026-07-30): 51 is the LOWEST slot of the
# ecosystem-verified-free set 51-67 and 69.  48 was originally picked as a free
# `nostr` row on the stock/a4091 kernel, but it is CONTESTED -- zz9000-amix's
# integration/kernel.c.txt documents an unpublished dev tree using 48 for `random`
# (49 = zz9000, published; 68 = va2000; 47 = stock contrib/mx AND hydra).  68 is
# skipped and >=70 does not exist (CDEVSIZE = 70).  Evidence + the full cross-tree
# claim table: ../grimoire-amix/docs/reference/major-number-registry.md
# ("Major-Number Registry").  Longer note in BUILD.md section 2(b).
#
net  z3660eth  z3660eth.c  z3660ethinfo  51  zen  "Z3660 Ethernet"
